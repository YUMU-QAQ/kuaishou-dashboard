<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登入 · 青野快手数据看板</title>
<style>
:root{color-scheme:dark;
--bg:#080B11;--card:rgba(255,255,255,.045);--card-line:rgba(255,255,255,.14);
--fg:#E9EDF5;--muted:#95A0B3;--placeholder:#808B9E;
--brand:#FF6A1A;--brand2:#FFA53B;--ink:#1A0B02;--bad:#FF8080;
--ring:rgba(255,166,90,.55);--radius:16px}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);
font:15px/1.6 -apple-system,"Segoe UI",Roboto,"Helvetica Neue","Microsoft YaHei",sans-serif;
display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden}
/* 背景光斑 + 网格 */
body:before{content:"";position:absolute;inset:0;
background:
 radial-gradient(560px 380px at 18% 12%,rgba(255,106,26,.18),transparent 62%),
 radial-gradient(620px 420px at 84% 88%,rgba(56,110,255,.16),transparent 64%),
 radial-gradient(900px 600px at 50% 50%,rgba(255,165,59,.06),transparent 70%)}
body:after{content:"";position:absolute;inset:0;pointer-events:none;
background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
background-size:46px 46px;
mask-image:radial-gradient(720px 520px at 50% 45%,#000 30%,transparent 78%);
-webkit-mask-image:radial-gradient(720px 520px at 50% 45%,#000 30%,transparent 78%)}

.card{position:relative;z-index:1;width:100%;max-width:400px;
background:var(--card);border:1px solid var(--card-line);border-radius:var(--radius);
padding:36px 32px 30px;backdrop-filter:blur(16px) saturate(1.3);
-webkit-backdrop-filter:blur(16px) saturate(1.3);
box-shadow:0 24px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.07)}

.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.mark{width:36px;height:36px;border-radius:10px;flex:none;
background:linear-gradient(135deg,var(--brand),var(--brand2));
box-shadow:0 6px 18px rgba(255,106,26,.35);position:relative}
.mark:after{content:"";position:absolute;inset:9px 10px;border-radius:3px;
background:var(--ink);
clip-path:polygon(52% 0,100% 0,48% 46%,100% 46%,0 100%,44% 54%,0 54%)}
.brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.01em}
.brand p{margin:2px 0 0;font-size:13px;color:var(--muted)}

.field{margin-bottom:16px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}
.field input{width:100%;min-height:46px;padding:12px 14px;font:inherit;font-size:15px;color:var(--fg);
caret-color:var(--brand);
background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:10px;
transition:border-color 180ms ease,box-shadow 180ms ease,background 180ms ease}
.field input::placeholder{color:var(--placeholder)}
.field input:hover{border-color:rgba(255,255,255,.2)}
.field input:focus{outline:none;background:rgba(255,255,255,.075);
border-color:var(--brand);box-shadow:0 0 0 3px var(--ring)}
.field input[aria-invalid="true"]{border-color:rgba(255,128,128,.7)}
.field input[aria-invalid="true"]:focus{box-shadow:0 0 0 3px rgba(255,128,128,.28)}

.err{display:none;margin:0 0 16px;padding:10px 13px;font-size:14px;color:var(--bad);
background:rgba(255,128,128,.1);border:1px solid rgba(255,128,128,.32);border-radius:10px}
.err.show{display:block}
.err:focus{outline:none}

button{width:100%;min-height:48px;margin-top:4px;padding:13px;font:inherit;font-size:15px;font-weight:700;
color:var(--ink);background:linear-gradient(135deg,var(--brand),var(--brand2));
border:0;border-radius:10px;cursor:pointer;letter-spacing:.02em;
box-shadow:0 10px 24px rgba(255,106,26,.28);
transition:filter 180ms ease,transform 120ms ease,box-shadow 180ms ease}
button:hover{filter:brightness(1.06)}
button:active{transform:translateY(1px)}
button:focus-visible{outline:none;box-shadow:0 0 0 3px var(--ring),0 10px 24px rgba(255,106,26,.28)}
button:disabled{opacity:.6;cursor:default;filter:none;box-shadow:none}

.foot{margin:24px 0 0;text-align:center;font-size:13px;color:var(--muted)}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
@media (max-width:400px){
  body{padding:16px}
  .card{padding:28px 22px 24px}
}
</style>
</head>
<body>
<main class="card">
  <div class="brand">
    <div class="mark" aria-hidden="true"></div>
    <div>
      <h1>青野快手数据看板</h1>
      <p>快手商业化广告投放数据汇总</p>
    </div>
  </div>

  <form id="f" autocomplete="on" novalidate>
    <div class="field">
      <label for="u">账号</label>
      <input id="u" name="username" type="text" autocomplete="username"
             autocapitalize="off" spellcheck="false" placeholder="请输入账号"
             aria-describedby="err" required autofocus>
    </div>
    <div class="field">
      <label for="p">密码</label>
      <input id="p" name="password" type="password" autocomplete="current-password"
             placeholder="请输入密码" aria-describedby="err" required>
    </div>
    <p class="err" id="err" role="alert" tabindex="-1"></p>
    <button id="btn" type="submit">登 录</button>
  </form>

  <p class="foot">仅限内部使用 · 登录状态保留 7 天</p>
</main>

<script>
const f = document.getElementById("f"), btn = document.getElementById("btn"),
      err = document.getElementById("err"), u = document.getElementById("u"),
      p = document.getElementById("p");

function showError(msg) {
  err.textContent = msg;
  err.classList.add("show");
  u.setAttribute("aria-invalid", "true");
  p.setAttribute("aria-invalid", "true");
  err.focus();  // 键盘/读屏用户能直接听到错误
}

f.addEventListener("submit", async (e) => {
  e.preventDefault();
  err.classList.remove("show");
  err.textContent = "";
  u.removeAttribute("aria-invalid");
  p.removeAttribute("aria-invalid");
  btn.disabled = true;
  btn.textContent = "登录中…";
  try {
    const r = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: u.value, password: p.value })
    });
    if (r.ok) { location.href = "/"; return; }
    let msg = "账号或密码不正确";
    try { msg = (await r.json()).detail || msg; } catch (_) {}
    showError(msg);
    p.select();
  } catch (_) {
    showError("无法连接服务器，请稍后重试");
  }
  btn.disabled = false;
  btn.textContent = "登 录";
});
</script>
</body>
</html>
